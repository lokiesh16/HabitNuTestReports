<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automation Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 { margin-bottom: 4px; }
    p { color: #94a3b8; }

    select {
      background: #1e293b;
      color: #e5e7eb;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 4px;
      margin-left: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #1e293b;
      text-align: left;
    }
    tr:hover { background: #1e293b; }

    .pass { color: #22c55e; font-weight: bold; }
    .fail { color: #ef4444; font-weight: bold; }

    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

<h1>📊 Automation Dashboard</h1>
<p>One place for all your test reports</p>

<div style="margin: 12px 0;">
  <label for="reportType">Report:</label>
  <select id="reportType" onchange="onReportChange()">
    <option value="web-report">Web</option>
    <option value="coaches-report">Coaches</option>
    <option value="api-report">API</option>
    <option value="ios-reports">iOS</option>
  </select>
</div>

<canvas id="trendChart" height="100"></canvas>

<table>
  <thead>
    <tr>
      <th>Run</th>
      <th>Date</th>
      <th>Environment</th>
      <th>Device</th>
      <th>Status</th>
      <th>Duration</th>
      <th>Report</th>
    </tr>
  </thead>
  <tbody id="runs"></tbody>
</table>

<script>
// let CURRENT_REPORT = 'web-report';
// const MAX_RUNS = 10;
// let chart;
const GITHUB_OWNER = 'lokiesh16';
const GITHUB_REPO = 'HabitNuTestReports';
const BRANCH = 'gh-pages';
const MAX_RUNS = 10;

let CURRENT_REPORT = 'web-report';
let chart;


/* ---------- Helpers ---------- */

function onReportChange() {
  CURRENT_REPORT = document.getElementById('reportType').value;
  if (chart) chart.destroy();
  document.getElementById('runs').innerHTML = '';
  loadDashboard();
}

function parseRunDate(run) {
  const [date, time] = run.split('_');
  return new Date(`${date}T${time.replace(/-/g, ':')}`);
}

function getEnvironmentLabel() {
  if (CURRENT_REPORT === 'api-report') return 'api';
  if (CURRENT_REPORT === 'coaches-report') return 'coaches';
  if (CURRENT_REPORT === 'ios-reports') return 'ios';
  return 'web';
}

function collectStats(node, stats) {
  if (node.statistic) {
    stats.passed += node.statistic.passed || 0;
    stats.failed += node.statistic.failed || 0;
    stats.broken += node.statistic.broken || 0;
    stats.skipped += node.statistic.skipped || 0;
    stats.total  += node.statistic.total  || 0;
  }
  if (node.children) {
    node.children.forEach(child => collectStats(child, stats));
  }
}

/* ---------- Main ---------- */

async function fetchRuns(reportDir) {
  const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${reportDir}?ref=${BRANCH}`;

  const res = await fetch(url);
  if (!res.ok) {
    throw new Error(`Failed to fetch ${reportDir}`);
  }

  const items = await res.json();

  return items
    .filter(item =>
      item.type === 'dir' &&
      /^\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}$/.test(item.name)
    )
    .map(item => ({
      run: item.name,
      date: parseRunDate(item.name)
    }))
    .sort((a, b) => a.date - b.date)
    .slice(-MAX_RUNS);
}


async function loadDashboard() {
  // const runs = await fetchRuns(`${CURRENT_REPORT}/runs.json`);
  const runs = await fetchRuns(CURRENT_REPORT);

  const sortedRuns = runs
    // .map(run => ({ run, date: parseRunDate(run) }))
    .sort((a, b) => a.date - b.date)
    .slice(-MAX_RUNS);

  const trendData = [];
  const tableBody = document.getElementById('runs');
  tableBody.innerHTML = '';

  for (const item of sortedRuns) {
    const summaryUrl = `${CURRENT_REPORT}/${item.run}/widgets/summary.json`;

    try {
      const suites = await fetch(summaryUrl).then(r => r.json());

      const stats = { passed: 0, failed: 0, broken: 0, skipped: 0, total: 0 };

      if (Array.isArray(suites)) {
        suites.forEach(s => collectStats(s, stats));
      } else {
        collectStats(suites, stats);
      }

      const effectiveFailed = stats.failed + stats.broken;

      trendData.push({
        label: item.run,
        passed: stats.passed,
        failed: effectiveFailed
      });

      const statusClass = effectiveFailed > 0 ? 'fail' : 'pass';
      const statusText  = effectiveFailed > 0 ? 'FAILED' : 'PASSED';

      tableBody.innerHTML += `
        <tr>
          <td>${item.run}</td>
          <td>${item.date.toISOString().split('T')[0]}</td>
          <td>staging</td>
          <td>${getEnvironmentLabel()}</td>
          <td class="${statusClass}">
            ${statusText} (${stats.passed}/${stats.total})
          </td>
          <td>-</td>
          <td>
            <a href="${CURRENT_REPORT}/${item.run}/index.html" target="_blank">
              View Allure
            </a>
          </td>
        </tr>
      `;
    } catch (e) {
      console.error(`Failed loading ${summaryUrl}`, e);
    }
  }

  renderTrendChart(trendData);
}

/* ---------- Chart ---------- */

function renderTrendChart(data) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.label),
      datasets: [
        {
          label: 'Passed',
          data: data.map(d => d.passed),
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34,197,94,0.2)',
          tension: 0.3
        },
        {
          label: 'Failed',
          data: data.map(d => d.failed),
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239,68,68,0.2)',
          tension: 0.3
        }
      ]
    },
    options: {
      responsive: true,
      plugins: { legend: { position: 'top' } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 } }
      }
    }
  });
}

loadDashboard();
</script>

</body>
</html>
