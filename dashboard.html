<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automation Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 { margin-bottom: 4px; }
    p { color: #94a3b8; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #1e293b;
      text-align: left;
    }
    tr:hover { background: #1e293b; }

    .pass { color: #22c55e; font-weight: bold; }
    .fail { color: #ef4444; font-weight: bold; }

    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>

<body>

<h1>📊 Automation Dashboard</h1>
<p>One place for all your test reports</p>

<canvas id="trendChart" height="100"></canvas>

<table>
  <thead>
    <tr>
      <th>Run</th>
      <th>Date</th>
      <th>Environment</th>
      <th>Device</th>
      <th>Status</th>
      <th>Duration</th>
      <th>Report</th>
    </tr>
  </thead>
  <tbody id="runs"></tbody>
</table>

<script>
const MAX_RUNS = 10;
let chart;

/* ---------- Helpers ---------- */

function parseRunDate(run) {
  const [date, time] = run.split('_');
  return new Date(`${date}T${time.replace(/-/g, ':')}`);
}

function collectStats(node, stats) {
  if (node.statistic) {
    stats.passed += node.statistic.passed || 0;
    stats.failed += node.statistic.failed || 0;
    stats.broken += node.statistic.broken || 0;
    stats.skipped += node.statistic.skipped || 0;
    stats.total  += node.statistic.total  || 0;
  }

  if (node.children) {
    node.children.forEach(child => collectStats(child, stats));
  }
}

/* ---------- Main ---------- */

async function loadDashboard() {
  const runs = await fetch('web-report/runs.json').then(r => r.json());

  const sortedRuns = runs
    .map(run => ({ run, date: parseRunDate(run) }))
    .sort((a, b) => a.date - b.date)
    .slice(-MAX_RUNS);

  const trendData = [];
  const tableBody = document.getElementById('runs');
  tableBody.innerHTML = '';

  for (const item of sortedRuns) {
    const summaryUrl = `web-report/${item.run}/widgets/summary.json`;

    try {
      const suites = await fetch(summaryUrl).then(r => r.json());

      const stats = {
        passed: 0,
        failed: 0,
        broken: 0,
        skipped: 0,
        total: 0
      };

      if (Array.isArray(suites)) {
        suites.forEach(suite => collectStats(suite, stats));
      } else {
        collectStats(suites, stats);
      }
      const effectiveFailed = stats.failed + stats.broken;
      trendData.push({
        label: item.run,
        passed: stats.passed,
        failed: effectiveFailed
      });

      const statusClass = effectiveFailed > 0 ? 'fail' : 'pass';
      const statusText  = effectiveFailed > 0 ? 'FAILED' : 'PASSED';

      tableBody.innerHTML += `
        <tr>
          <td>${item.run}</td>
          <td>${item.date.toISOString().split('T')[0]}</td>
          <td>staging</td>
          <td>iPhone (physical)</td>
          <td class="${statusClass}">
            ${statusText} (${stats.passed}/${stats.total})
          </td>
          <td>-</td>
          <td>
            <a href="web-report/${item.run}/index.html" target="_blank">
              View Allure
            </a>
          </td>
        </tr>
      `;
    } catch (e) {
      console.error(`Failed loading ${summaryUrl}`, e);
    }
  }

  renderTrendChart(trendData);
}

/* ---------- Chart ---------- */

function renderTrendChart(data) {
  const ctx = document.getElementById('trendChart').getContext('2d');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.label),
      datasets: [
        {
          label: 'Passed',
          data: data.map(d => d.passed),
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34,197,94,0.2)',
          tension: 0.3
        },
        {
          label: 'Failed',
          data: data.map(d => d.failed),
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239,68,68,0.2)',
          tension: 0.3
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top' }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { precision: 0 }
        }
      }
    }
  });
}

loadDashboard();
</script>

</body>
</html>
