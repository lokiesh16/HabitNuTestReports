<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Automation Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 { margin-bottom: 4px; }
    p { color: #94a3b8; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #1e293b;
      text-align: left;
    }
    tr:hover {
      background: #1e293b;
    }
    .pass { color: #22c55e; font-weight: bold; }
    .fail { color: #ef4444; font-weight: bold; }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>

<h1>📊 Automation Dashboard</h1>
<p>One place for all your test reports</p>

<table>
  <thead>
    <tr>
      <th>Run</th>
      <th>Date</th>
      <th>Environment</th>
      <th>Device</th>
      <th>Status</th>
      <th>Duration</th>
      <th>Report</th>
    </tr>
  </thead>
  <tbody id="runs"></tbody>
</table>

<script>
const MAX_RUNS = 10;
let allRuns = [];

function parseRunDate(run) {
  // Converts: 2025-12-23_15-05-12 → Date
  const [date, time] = run.split('_');
  const formatted = `${date}T${time.replace(/-/g, ':')}`;
  return new Date(formatted);
}

async function loadDashboard() {
  const runs = await fetch('web-report/runs.json').then(r => r.json());

  // Sort latest first
  allRuns = runs
    .map(run => ({ run, date: parseRunDate(run) }))
    .sort((a, b) => b.date - a.date);

  renderRuns(allRuns.slice(0, MAX_RUNS));
}

async function renderRuns(runs) {
  const tbody = document.getElementById('runs');
  tbody.innerHTML = '';

  for (const item of runs) {
    const summaryUrl = `web-report/${item.run}/widgets/summary.json`;

    try {
      const summary = await fetch(summaryUrl).then(r => r.json());
      const stat = summary.statistic;

      const statusClass = stat.failed > 0 ? 'fail' : 'pass';
      const statusText = stat.failed > 0 ? 'FAILED' : 'PASSED';

      tbody.innerHTML += `
        <tr>
          <td>${item.run}</td>
          <td>${item.date.toISOString().split('T')[0]}</td>
          <td>staging</td>
          <td>Web-UserPortal</td>
          <td class="${statusClass}">
            ${statusText} (${stat.passed}/${stat.total})
          </td>
          <td>${Math.round(summary.time.duration / 60000)}m</td>
          <td>
            <a href="web-report/${item.run}/index.html" target="_blank">
              View Allure
            </a>
          </td>
        </tr>
      `;
    } catch (e) {
      console.error(`Failed loading ${summaryUrl}`, e);
    }
  }
}

loadDashboard();
</script>


</body>
</html>
