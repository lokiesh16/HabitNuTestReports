<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Automation Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 { margin-bottom: 4px; }
    p { color: #94a3b8; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #334155;
    }
    th {
      background: #1e293b;
      text-align: left;
    }
    tr:hover {
      background: #1e293b;
    }
    .pass { color: #22c55e; font-weight: bold; }
    .fail { color: #ef4444; font-weight: bold; }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
</head>
<body>
<body>

<canvas id="trendChart" height="100"></canvas>

<h1>📊 Automation Dashboard</h1>
<p>One place for all your test reports</p>
<table>
  <thead>
    <tr>
      <th>Run</th>
      <th>Date</th>
      <th>Environment</th>
      <th>Device</th>
      <th>Status</th>
      <th>Duration</th>
      <th>Report</th>
    </tr>
  </thead>
  <tbody id="runs"></tbody>
</table>

<script>
const MAX_RUNS = 10;
let chart;

function parseRunDate(run) {
  const [date, time] = run.split('_');
  return new Date(`${date}T${time.replace(/-/g, ':')}`);
}

async function loadDashboard() {
  const runs = await fetch('web-report/runs.json').then(r => r.json());

  const sortedRuns = runs
    .map(run => ({ run, date: parseRunDate(run) }))
    .sort((a, b) => a.date - b.date)   // oldest → newest
    .slice(-MAX_RUNS);

  const trendData = [];
  const tableBody = document.getElementById('runs');
  tableBody.innerHTML = '';

  for (const item of sortedRuns) {
    const summaryUrl = `web-report/${item.run}/data/suites.json`;

    try {
      const suites = await fetch(summaryUrl).then(r => r.json());

      let passed = 0, failed = 0, total = 0;

      suites.children.forEach(suite => {
        if (suite.statistic) {
          passed += suite.statistic.passed || 0;
          failed += suite.statistic.failed || 0;
          total  += suite.statistic.total  || 0;
        }
      });

      trendData.push({
        label: item.run,
        passed,
        failed
      });

      const statusClass = failed > 0 ? 'fail' : 'pass';
      const statusText = failed > 0 ? 'FAILED' : 'PASSED';

      tableBody.innerHTML += `
        <tr>
          <td>${item.run}</td>
          <td>${item.date.toISOString().split('T')[0]}</td>
          <td>staging</td>
          <td>iPhone (physical)</td>
          <td class="${statusClass}">
            ${statusText} (${passed}/${total})
          </td>
          <td>-</td>
          <td>
            <a href="web-report/${item.run}/index.html" target="_blank">
              View Allure
            </a>
          </td>
        </tr>
      `;
    } catch (e) {
      console.error(`Failed loading ${summaryUrl}`, e);
    }
  }

  renderTrendChart(trendData);
}

function renderTrendChart(data) {
  const ctx = document.getElementById('trendChart').getContext('2d');

  const labels = data.map(d => d.label);
  const passed = data.map(d => d.passed);
  const failed = data.map(d => d.failed);

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'Passed',
          data: passed,
          borderColor: '#22c55e',
          backgroundColor: 'rgba(34,197,94,0.2)',
          tension: 0.3
        },
        {
          label: 'Failed',
          data: failed,
          borderColor: '#ef4444',
          backgroundColor: 'rgba(239,68,68,0.2)',
          tension: 0.3
        }
      ]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'top' }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { precision: 0 }
        }
      }
    }
  });
}

loadDashboard();
</script>



</body>
</html>
